<!DOCTYPE html>
<html>
<head>
  <title>Logo Design</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    /* Gallery layout */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .gallery img {
      width: 250px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 10px;
      animation: fadeIn 0.4s;
    }

    /* Fade animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    a {
      color: cyan;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>Logo Design</h1>
  <p>Modern brand logo concept</p>

  <!-- Gallery -->
  <div class="gallery">
    <img src="smm1.jpg" onclick="openModal(this)">
    <img src="smm2.jpg" onclick="openModal(this)">
    <img src="smm3.jpg" onclick="openModal(this)">
    <img src="smm4.jpg" onclick="openModal(this)">
    <img src="smm5.jpg" onclick="openModal(this)">
  </div>

  <br><br>
  <a href="projects.html"> Back to Projects</a>

  <!-- Modal -->
  <div id="myModal" class="modal" onclick="closeModal()">
    <img id="modalImg">
  </div>

  <!-- JS -->
  <script>
    function openModal(img) {
      var modal = document.getElementById("myModal");
      var modalImg = document.getElementById("modalImg");

      modal.style.display = "flex";
      modalImg.src = img.src;
    }

    function closeModal() {
      document.getElementById("myModal").style.display = "none";
    }

    // ESC key close
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") {
        document.getElementById("myModal").style.display = "none";
      }
    });
  </script>

</body>
</html>
