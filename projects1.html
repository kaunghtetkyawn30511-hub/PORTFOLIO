<!DOCTYPE html>
<html>
<head>
  <title>Social Media Design</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    /* Gallery */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .gallery img {
      width: 250px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 10px;
      animation: fadeIn 0.4s;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    a {
      color: cyan;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>Social Media Design</h1>
  <p>Facebook & Instagram post design</p>

  <!-- Gallery -->
  <div class="gallery">
    <img src="sm1.jpg" onclick="openModal(this)">
    <img src="sm2.jpg" onclick="openModal(this)">
    <img src="sm3.jpg" onclick="openModal(this)">
    <img src="sm4.jpg" onclick="openModal(this)">
    <img src="sm5.jpg" onclick="openModal(this)">
    <img src="sm6.jpg" onclick="openModal(this)">
    <img src="sm7.jpg" onclick="openModal(this)">
    <img src="sm8.jpg" onclick="openModal(this)">
    <img src="sm9.jpg" onclick="openModal(this)">
    <img src="sm10.jpg" onclick="openModal(this)">
    <img src="sm11.jpg" onclick="openModal(this)">
    <img src="sm12.jpg" onclick="openModal(this)">
  </div>

  <br><br>
  <a href="projects.html">Back to Projects</a>

  <!-- Modal -->
  <div id="myModal" class="modal" onclick="closeModal()">
    <img id="modalImg">
  </div>

  <!-- JS -->
  <script>
    function openModal(img) {
      var modal = document.getElementById("myModal");
      var modalImg = document.getElementById("modalImg");

      modal.style.display = "flex";
      modalImg.src = img.src;
    }

    function closeModal() {
      document.getElementById("myModal").style.display = "none";
    }
  </script>

</body>
</html>
