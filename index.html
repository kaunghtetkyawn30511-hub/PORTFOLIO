<!DOCTYPE html>
<html>
<head>
  <title>Kaung Htet Kyaw Portfolio</title>

  <style>
    :root {
      --bg: #0f172a;
      --text: white;
      --card: rgba(255,255,255,0.05);
    }

    body {
      margin: 0;
      font-family: Arial;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,255,255,0.2);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid cyan;
      margin-bottom: 10px;
    }

    h1 { margin: 10px 0; }

    .button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background: cyan;
      color: black;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      background: white;
      transform: scale(1.05);
    }

    /* CV highlight */
    .cv {
      background: #22c55e;
      color: white;
    }

    .cv:hover {
      background: #16a34a;
    }

    /* Social */
    .social {
      margin-top: 20px;
    }

    .social a {
      margin: 0 10px;
      font-size: 14px;
      text-decoration: none;
      color: var(--text);
      transition: 0.3s;
    }

    .social a:hover {
      color: cyan;
    }

  </style>
</head>

<body>

  <div class="card">

    <img src="profile.jpg">

    <h1>Kaung Htet Kyaw</h1>
    <p>Graphic Designer</p>

    <!-- CV TOP -->
    <a href="KaungHtetKyaw_CV.pdf" download class="button cv"> Download CV</a>

    <a href="about.html" class="button">About Me</a>
    <a href="projects.html" class="button">My Projects</a>

    <!-- Contact -->
    <a href="mailto:kaunghtetkyaw.n30511@gmail.com" class="button">
       Send Mail
    </a>

    <a href="tel:+660655019936" class="button">
     Call Me
    </a>

    <!-- Social -->
    <div class="social">
      <a href="https://www.facebook.com/share/1GNkG8WGLi/?mibextid=wwXIfr" target="_blank">Facebook</a>
      <a href="https://line.me/ti/p/UfKE-9zLD5" target="_blank">Line</a>
      <a href="https://www.instagram.com/kaunghtet.2001" target="_blank">Instagram</a>
    </div>

  </div>

  <!-- JS -->
  <script>
    // Page transition
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", function(e) {
        if (this.href.includes(".html")) {
          e.preventDefault();
          document.body.style.opacity = 0;
          setTimeout(() => {
            window.location = this.href;
          }, 300);
        }
      });
    });
  </script>

</body>
</html>
